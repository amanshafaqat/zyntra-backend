name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-unit:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run tests/unit
        env:
          JWT_ACCESS_SECRET: ci-access-secret-at-least-16-chars
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-16-chars
          DATABASE_URL: postgresql://zyntra:zyntra@localhost:5432/zyntra_test?schema=public

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zyntra
          POSTGRES_PASSWORD: zyntra
          POSTGRES_DB: zyntra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zyntra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zyntra:zyntra@localhost:5432/zyntra_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-16-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-16-chars
      NODE_ENV: test
      PUBLIC_URL: http://localhost:4001
      BCRYPT_ROUNDS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply database schema
        # `migrate deploy` is the production path and requires committed
        # migrations. Before the first `prisma migrate dev --name init` is
        # committed, fall back to `db push` so CI is never blocked.
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            echo "::warning::prisma/migrations is absent — using db push. Commit an initial migration."
            npx prisma db push --skip-generate
          fi

      - name: Seed catalog
        run: npm run seed

      - name: Integration tests
        run: npx vitest run tests/integration

  python:
    name: ML service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - run: pip install -r requirements.txt

      - name: Import check
        run: python -c "import app; print('ml-service imports cleanly')"

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint-and-unit, integration, python]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zyntra-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: false
          load: true
          tags: zyntra-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
