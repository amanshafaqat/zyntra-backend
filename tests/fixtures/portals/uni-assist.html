<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>uni-assist e.V. Application Portal</title>
</head>
<body>
  <h1>uni-assist Application Form</h1>
  <form id="uni-assist-form">
    <label>Applicant Full Name: <input type="text" name="applicant_name" id="applicant_name" /></label><br/>
    <label>Email Address: <input type="email" name="applicant_email" id="applicant_email" /></label><br/>
    <label>Bachelor Degree Title: <input type="text" name="bachelor_degree" id="bachelor_degree" /></label><br/>
    <label>Home University: <input type="text" name="university_name" id="university_name" /></label><br/>
    <label>CGPA Grade: <input type="text" name="cgpa_grade" id="cgpa_grade" /></label><br/>
    <label>IELTS Band Score: <input type="text" name="ielts_score" id="ielts_score" /></label><br/>
    <label>Account Password: <input type="password" name="user_password" id="user_password" /></label><br/>
    <input type="submit" value="Submit Application" />
  </form>
</body>
</html>
