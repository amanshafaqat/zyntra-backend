<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TUMonline — Technical University of Munich</title>
</head>
<body>
  <h1>TUMonline Master Application</h1>
  <form id="tum-form">
    <label>Full Name: <input type="text" name="fullname" aria-label="Full Name" /></label><br/>
    <label>Email: <input type="email" name="user_email" aria-label="Email Address" /></label><br/>
    <label>Prior Qualification: <input type="text" name="qualification" placeholder="Degree Major" /></label><br/>
    <label>Institution: <input type="text" name="institution" placeholder="University" /></label><br/>
    <label>GPA: <input type="text" name="gpa" aria-label="GPA Score" /></label><br/>
    <label>TOEFL Score: <input type="text" name="toefl_score" /></label><br/>
    <label>Payment Credit Card: <input type="text" name="card_number" id="card_number" /></label><br/>
  </form>
</body>
</html>
